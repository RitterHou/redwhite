  <rect x="7" y="5" width="18" height="6" rx="1.4" fill="#c22b36"/>
  <rect x="2" y="15.3" width="28" height="2.8" fill="#c22b36"/>
  <rect x="2" y="21.5" width="28" height="8.2" rx="1.9" fill="#f4efe3"/>
  <g fill="#2f2f2f">
    <rect x="6" y="24.6" width="6" height="2" rx="1"/>
    <rect x="8" y="22.6" width="2" height="6" rx="1"/>
  </g>
  <g fill="#c22b36">
    <circle cx="21.5" cy="25.6" r="1.75"/>
    <circle cx="26" cy="25.6" r="1.75"/>
